version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ledger.db
      - ASR_PROVIDER=mock
      - LLM_PROVIDER=mock
      - MERCHANT_VPA=demo@upi
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ./backend:/app/backend
      - db-data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  db-data:
